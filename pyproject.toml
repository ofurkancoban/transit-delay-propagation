[project]
name = "transit-delay-propagation"
version = "0.1.0"
description = "Delay propagation, prediction and spillover estimation on the German public transport network"
requires-python = ">=3.11"
dependencies = [
    "gtfs-realtime-bindings",
    "requests",
    "pyarrow",
    "duckdb",
    "polars",
    "pyyaml",
    "python-dotenv",
    "holidays",
    "lightgbm",
    "scikit-learn",
    "pandas",
    "torch",
    # torch-geometric intentionally not a dependency: src/models/stgnn.py
    # implements its message passing directly with plain torch tensor ops
    # instead, see that module's docstring for why.
    "libpysal",
    "spreg",
    "statsmodels",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "jupyter", "nbformat", "matplotlib"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
